name: Academic Core Verification
on:
  push:
    branches: [avora-academic-core-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Answer marking regression
        run: npm run test:answer-marking
      - name: Dawn guardian and PIN security tests
        run: npm run test:dawn-security
      - name: Starting-check policy tests
        run: npm run test:weekly-baseline
      - name: Weekly objective publication security tests
        run: npm run test:weekly-objective-review
      - name: Weekly publication readiness regression
        run: npm run test:weekly-publication-readiness
      - name: Weekly release readiness tests
        run: npm run test:weekly-release-readiness
      - name: Weekly pilot activation security tests
        run: npm run test:weekly-pilot-gate
      - name: Student weekly visibility regression
        run: npm run test:weekly-student-visibility
      - name: Weekly curriculum import checks
        run: npm run test:weekly-curriculum-import
      - name: Reviewed live question bank gate
        run: npm run test:weekly-live-question-bank
      - name: Student release window boundary tests
        run: npm run test:weekly-release-window
      - name: Weekly coverage grid tests
        run: npm run test:weekly-coverage-grid
      - name: Unpublished curriculum release gate
        run: npm run test:weekly-unpublished-gate
      - name: Curriculum audits
        run: npm run audit:curriculum
      - name: Next.js production build
        run: |
          export AUTH_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("hex"))')"
          npm run build
